name: Daily News Digest

on:
  schedule:
    # 00:00 UTC = 07:00 giờ Việt Nam
    - cron: "17 0 * * *"
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news digest
        env:
          GMAIL_USER: ${{ secrets.MY_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.MY_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python news_digest.py
